<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>BuildFromStorage mod icon</title>
  <desc>A wooden chest points to a hammer striking a small timber house inside the shared carved-wood frame.</desc>
  <defs>
    <linearGradient id="buildChest" x2="0" y2="1">
      <stop stop-color="#a37646"/>
      <stop offset="1" stop-color="#483021"/>
    </linearGradient>
    <linearGradient id="buildGold">
      <stop stop-color="#f3d396"/>
      <stop offset="1" stop-color="#b17639"/>
    </linearGradient>
    <linearGradient id="buildWood" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#b9824b"/>
      <stop offset="0.5" stop-color="#70462d"/>
      <stop offset="1" stop-color="#38251c"/>
    </linearGradient>
    <linearGradient id="buildWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bd8952"/>
      <stop offset="1" stop-color="#70462d"/>
    </linearGradient>
    <filter id="buildShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.65"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <image href="../../assets/icons/valheim-panel.svg" width="512" height="512"/>
  <g transform="translate(-20 -36)" stroke="#17110d" stroke-width="9" stroke-linejoin="round">
    <path d="M133 249 L273 249 L283 282 L283 352 L133 352 Z" fill="url(#buildChest)"/>
    <path d="M133 249 Q203 214 273 249 L283 282 L133 282 Z" fill="url(#buildChest)"/>
    <path d="M158 248 L158 352 M254 245 L254 352 M133 282 L283 282" fill="none" stroke="#9b9b81" stroke-width="12"/>
    <rect x="195" y="276" width="28" height="33" rx="3" fill="url(#buildGold)"/>
  </g>
  <path d="M193 193 Q250 127 310 178 L288 174 M310 178 L306 155"
    transform="translate(-23 -21)" fill="none" stroke="#f3d396" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(-28 -24)" stroke="#17110d" stroke-width="9" stroke-linejoin="round" filter="url(#buildShadow)">
    <path d="M320 341 L374 295 L428 341 L428 386 L320 386 Z" fill="url(#buildWall)"/>
    <path d="M310 338 L374 283 L438 338 L427 351 L374 308 L321 351 Z" fill="url(#buildWood)"/>
    <path d="M358 351 L389 351 L389 386 L358 386 Z" fill="#4a3022" stroke-width="7"/>
    <rect x="329" y="350" width="18" height="17" fill="url(#buildGold)" stroke-width="6"/>
    <circle cx="382" cy="370" r="2.5" fill="#f3d396" stroke="none"/>
    <path d="M329 374 L347 374 M400 367 L420 367" fill="none" stroke="#d2a06a" stroke-width="4"/>
  </g>
  <g transform="translate(-22 -68) translate(374.5 275) rotate(-40) scale(-1 1) translate(-374.5 -275)">
    <g stroke="#17110d" stroke-width="8" stroke-linejoin="round" filter="url(#buildShadow)">
      <path d="M367 270 L382 280 L423 218 L409 208 Z" fill="url(#buildWood)"/>
      <path d="M346 272 L362 249 L403 278 L387 301 Z" fill="url(#buildWall)"/>
      <path d="M346 272 L362 249 L373 257 L357 280 Z" fill="#70462d" stroke-width="5"/>
      <path d="M362 254 L399 280" fill="none" stroke="#d2a06a" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
  <g transform="translate(-22 -66)" fill="none" stroke="#f3d396" stroke-width="5" stroke-linecap="round">
    <path d="M359 304 L355 310 M368 306 L368 313 M377 307 L383 313"/>
  </g>
  <image href="../../assets/icons/valheim-wood-frame.svg" width="512" height="512"/>
</svg>