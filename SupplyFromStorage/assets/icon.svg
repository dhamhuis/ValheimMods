<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>SupplyFromStorage mod icon</title>
  <desc>A storage chest supplies fuel to a furnace inside the shared carved-wood frame.</desc>
  <defs>
    <linearGradient id="chest" x2="0" y2="1">
      <stop stop-color="#a37646"/>
      <stop offset="1" stop-color="#483021"/>
    </linearGradient>
    <linearGradient id="gold">
      <stop stop-color="#f3d396"/>
      <stop offset="1" stop-color="#b17639"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9d3bb"/>
      <stop offset="1" stop-color="#65756f"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ca692f"/>
      <stop offset="1" stop-color="#f4d28c"/>
    </linearGradient>
    <filter id="symbolShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.65"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <image href="../../assets/icons/valheim-panel.svg" width="512" height="512"/>
  <g stroke="#17110d" stroke-width="9" stroke-linejoin="round" transform="translate(-12 -36)">
    <path d="M133 249 L273 249 L283 282 L283 352 L133 352 Z" fill="url(#chest)"/>
    <path d="M133 249 Q203 214 273 249 L283 282 L133 282 Z" fill="url(#chest)"/>
    <path d="M158 248 L158 352 M254 245 L254 352 M133 282 L283 282" fill="none" stroke="#9b9b81" stroke-width="12"/>
    <rect x="195" y="276" width="28" height="33" rx="3" fill="url(#gold)"/>
  </g>
  <g fill="none" stroke="#f3d396" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M193 193 Q250 127 310 178 L288 174 M310 178 L306 155" transform="translate(15 -3)"/>
    <path d="M193 193 Q250 127 310 178 L288 174 M310 178 L306 155" transform="translate(0 512) scale(1 -1) translate(15 -3)"/>
  </g>
  <g filter="url(#symbolShadow)" stroke="#191513" stroke-width="8" stroke-linejoin="round" transform="translate(-268 -236) scale(1.65)">
    <path d="M361 279 L394 279 L402 333 L353 333 Z" fill="url(#metal)"/>
    <path d="M356 278 L360 262 L395 262 L400 278 Z" fill="#56645f"/>
    <path d="M375 294 C357 313 369 323 380 323 C396 320 391 306 383 292 C382 305 378 306 375 294 Z" fill="url(#flame)" stroke="none"/>
  </g>
  <image href="../../assets/icons/valheim-wood-frame.svg" x="0" y="0" width="512" height="512"/>
</svg>