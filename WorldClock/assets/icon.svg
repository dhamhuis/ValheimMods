<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>WorldClock mod icon</title>
  <desc>A brass-rimmed clock face with hands indicating the passage of time.</desc>
  <defs>
    <radialGradient id="clockFace" cx="38%" cy="30%" r="72%">
      <stop offset="0" stop-color="#647065"/>
      <stop offset="0.62" stop-color="#35443d"/>
      <stop offset="1" stop-color="#1b2926"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d394"/>
      <stop offset="0.5" stop-color="#bd8141"/>
      <stop offset="1" stop-color="#72401f"/>
    </linearGradient>
    <filter id="clockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <image href="../../assets/icons/valheim-panel.svg" width="512" height="512"/>
  <g filter="url(#clockShadow)">
    <circle cx="256" cy="248" r="118" fill="#121916" stroke="#18110c" stroke-width="18"/>
    <circle cx="256" cy="248" r="106" fill="url(#clockFace)" stroke="url(#brass)" stroke-width="10"/>
    <g stroke="#f0ce8b" stroke-width="8" stroke-linecap="round">
      <path d="M256 158 V174"/>
      <path d="M256 322 V338"/>
      <path d="M166 248 H182"/>
      <path d="M330 248 H346"/>
    </g>
    <path d="M256 248 L256 190" fill="none" stroke="#f4e3bf" stroke-width="12" stroke-linecap="round"/>
    <path d="M256 248 L305 278" fill="none" stroke="#d89a4e" stroke-width="15" stroke-linecap="round"/>
    <circle cx="256" cy="248" r="12" fill="#f3d394" stroke="#392718" stroke-width="5"/>
    <path d="M205 114 L215 92 M298 391 L307 369" stroke="url(#brass)" stroke-width="10" stroke-linecap="round"/>
  </g>
  <image href="../../assets/icons/valheim-wood-frame.svg" width="512" height="512"/>
</svg>